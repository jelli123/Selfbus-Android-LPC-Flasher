#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Mon Feb 16 16:59:40 CET 2026
# NOTE: android.newDsl and android.builtInKotlin are intentionally kept at their
# legacy value: this project applies the standalone Kotlin Android plugin and the
# build depends on the legacy variant API, so switching to the new defaults can
# break the build. The remaining legacy compatibility flags were removed to clear
# the AGP 9 deprecation warnings (their new defaults are safe for this project:
# no <uses-sdk> in the manifest, targetSdk is set explicitly, and no resValue /
# resource-shrinking DSL is used).
android.builtInKotlin=false
android.dependency.useConstraints=true
android.enableJetifier=false
android.newDsl=false
android.r8.strictFullModeForKeepRules=false
android.uniquePackageNames=false
android.useAndroidX=true
# Suppress the "excludeLibraryComponentsFromConstraints" import-performance hint.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
org.gradle.configuration-cache=true
